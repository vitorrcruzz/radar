<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · RADAR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; }
    .login-card { width: min(420px, calc(100vw - 2rem)); }
  </style>
</head>
<body>
  <main class="login-card table-card p-4">
    <h1 class="h4 mb-1">RADAR</h1>
    <p class="text-secondary mb-4">Rastreamento Automático de Ativos de Rede</p>
    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensagem in mensagens %}
        <div class="alert alert-{{ categoria }}" role="alert">{{ mensagem }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post" autocomplete="on">
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input id="email" name="email" type="email" class="form-control" autocomplete="username" required autofocus>
      </div>
      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input id="senha" name="senha" type="password" class="form-control" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
